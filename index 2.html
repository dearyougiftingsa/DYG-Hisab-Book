<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ব্যবসার খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: মোবাইল-প্রথম। উপরে দোকানের নাম, মাঝে বেছে নেওয়া ট্যাবের কাজ, নিচে ছয় ট্যাবের নেভিগেশন (হোম, অর্ডার, বাকি, পণ্য, খরচ, আরও)। ফর্মগুলো নিচ থেকে ওঠা শিটে খোলে। */
:root {
  --bg: #EEF2EF; --surface: #FFFFFF; --field: #F6F8F7; --ink: #14201C; --muted: #5B6B65; --line: #D5DDD8;
  --accent: #25457F; --accent-ink: #FFFFFF;
  --in: #177A55; --in-bg: #E1F1E9; --out: #B83A3A; --out-bg: #F8E6E4; --warn: #8A5A00; --warn-bg: #FCEFD2;
  --f-display: "Baloo Da 2", "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --f-body: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #17211D; --field: #121B17; --ink: #E7EEEA; --muted: #97A8A1; --line: #2A3832;
    --accent: #8CAAF0; --accent-ink: #0E1626; --in: #4CC592; --in-bg: #163226; --out: #F0807B; --out-bg: #3A201F;
    --warn: #F2C26B; --warn-bg: #3A2F14; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #17211D; --field: #121B17; --ink: #E7EEEA; --muted: #97A8A1; --line: #2A3832;
  --accent: #8CAAF0; --accent-ink: #0E1626; --in: #4CC592; --in-bg: #163226; --out: #F0807B; --out-bg: #3A201F;
  --warn: #F2C26B; --warn-bg: #3A2F14; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(92px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 600px; margin: 0 auto; display: grid; gap: 14px; }
main { display: grid; gap: 14px; min-width: 0; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); line-height: 1.25; text-wrap: balance; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.pos { color: var(--in); }
.neg { color: var(--out); }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top p { margin: 0; color: var(--muted); font-size: 0.9rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card > h2 + * { margin-top: 12px; }

/* buttons */
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { background: var(--out); border-color: var(--out); color: #fff; font-weight: 600; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 0.92rem; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
.bar2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btnrow.end { justify-content: flex-end; margin-top: 16px; }

/* day / month switch */
.daynav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.daynav button { min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 1.3rem; line-height: 1; }
.daynav .label { text-align: center; font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; }

/* numbers */
.lab { color: var(--muted); font-size: 0.88rem; }
.big { font-family: var(--f-display); font-weight: 700; font-size: 2.3rem; line-height: 1.15; overflow-wrap: anywhere; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.tile { border-radius: 10px; padding: 10px 12px; background: var(--field); border: 1px solid var(--line); min-width: 0; }
.tile span { display: block; font-size: 0.84rem; color: var(--muted); }
.tile strong { display: block; font-family: var(--f-display); font-size: 1.15rem; overflow-wrap: anywhere; }
.kv { display: grid; gap: 8px; margin: 0; }
.kv div { display: flex; justify-content: space-between; gap: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-display); font-weight: 600; text-align: right; }
.kv .total { border-top: 1px solid var(--line); padding-top: 8px; }

.d7 { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.d7 li { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; font-size: 0.92rem; }
.d7b { height: 8px; background: var(--field); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.d7b i { display: block; height: 100%; border-radius: 99px; }
.d7b i.pos { background: var(--in); }
.d7b i.neg { background: var(--out); }
.d7v { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border: 1px dashed var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 0.92rem; }

/* inputs */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label { font-size: 0.88rem; color: var(--muted); font-weight: 500; }
.inp { width: 100%; min-height: 46px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); font-size: 16px; }
textarea.inp { resize: vertical; line-height: 1.5; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.form { display: grid; gap: 14px; }
.msg { min-height: 1.3em; margin: 0; font-size: 0.92rem; }
.msg.err { color: var(--out); }

.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; min-height: 40px; border: 1px solid var(--line); background: var(--field); border-radius: 10px; font-size: 0.92rem; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* order & customer cards */
.list { display: grid; gap: 12px; }
.row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.row-top > div { min-width: 0; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.badge { font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.b-ok { background: var(--in-bg); color: var(--in); }
.b-due { background: var(--out-bg); color: var(--out); }
.b-wait { background: var(--warn-bg); color: var(--warn); }
.lines { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; font-size: 0.94rem; }
.lines li { display: flex; justify-content: space-between; gap: 10px; }
.lines li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
@media (max-width: 420px) { .mini { grid-template-columns: repeat(2, 1fr); } }
.mini div { min-width: 0; }
.mini span { display: block; font-size: 0.78rem; color: var(--muted); }
.mini b { font-family: var(--f-display); font-size: 0.98rem; overflow-wrap: anywhere; }
.act { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.sub { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); display: grid; gap: 6px; font-size: 0.92rem; }
.sub > div { display: flex; justify-content: space-between; gap: 10px; }
.note { font-size: 0.88rem; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.ex-tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); font-size: 0.72rem; font-weight: 500; vertical-align: middle; }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; margin: 0; }
.day h3 { font-size: 0.92rem; color: var(--muted); padding-bottom: 6px; border-bottom: 2px solid var(--line); margin-top: 6px; }
.erow { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.bars { display: grid; gap: 12px; }
.bar-head { display: flex; justify-content: space-between; gap: 10px; font-size: 0.95rem; }
.track { height: 8px; border-radius: 99px; background: var(--field); border: 1px solid var(--line); overflow: hidden; margin-top: 4px; }
.fill { height: 100%; background: var(--out); border-radius: 99px; }
.steps { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

/* order form rows */
.irow { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
.irow .top2 { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: end; }
.irow .x { min-height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 1.2rem; color: var(--out); }
.irow .mf { display: grid; gap: 3px; min-width: 0; }
.irow .mf span { font-size: 0.78rem; color: var(--muted); }
.sumbox { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }

/* bottom nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.nav button { min-height: 58px; border: 0; background: transparent; color: var(--muted); font-size: 0.9rem; font-weight: 500; border-top: 3px solid transparent; padding: 0 2px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; border-top-color: var(--accent); }

/* sheet */
dialog { font: inherit; color: var(--ink); background: var(--surface); border: 0; padding: 0; width: min(560px, 100%); max-width: 100%; max-height: 92vh; max-height: 92dvh; border-radius: 18px; overflow: auto; }
dialog::backdrop { background: rgba(8, 14, 12, 0.55); }
@media (max-width: 600px) { dialog { margin: auto 0 0; border-radius: 18px 18px 0 0; } }
.dbody { display: grid; gap: 14px; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="shopName">আমার দোকান</h1>
      <p>ব্যবসার হিসাব</p>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" aria-label="মূল মেনু">
  <button type="button" data-tab="home">হোম</button>
  <button type="button" data-tab="orders">অর্ডার</button>
  <button type="button" data-tab="due">বাকি</button>
  <button type="button" data-tab="products">পণ্য</button>
  <button type="button" data-tab="expenses">খরচ</button>
  <button type="button" data-tab="more">আরও</button>
</nav>
<dialog id="dlg"></dialog>

<script>
(function () {
  'use strict';
  var KEY = 'byabsha-khata-v1';
  var DIG = '০১২৩৪৫৬৭৮৯';
  var CURS = ['﷼', '৳', '$', '₹'];
  var EXP_CATS = ['প্যাকেজিং', 'বিজ্ঞাপন', 'দোকান ভাড়া', 'বেতন', 'যাতায়াত', 'বিল', 'অন্যান্য'];
  var DEF = {
    shop: 'আমার দোকান', cur: '﷼', cc: '966',
    tplDue: 'প্রিয় {নাম}, {দোকান} থেকে বলছি। আপনার কাছে {বাকি} বাকি আছে। সুবিধামতো সময়ে পরিশোধ করার অনুরোধ রইল। ধন্যবাদ।',
    tplOrder: 'প্রিয় {নাম}, আপনার অর্ডার ({অর্ডার}) নেওয়া হয়েছে। মোট {মোট}, বাকি {বাকি}। {দোকান} এর সাথে থাকার জন্য ধন্যবাদ।'
  };

  var nf = new Intl.NumberFormat('bn-BD', { maximumFractionDigits: 2 });
  var mf = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' });
  var df = new Intl.DateTimeFormat('bn-BD', { weekday: 'long', day: 'numeric', month: 'long' });
  var ds = new Intl.DateTimeFormat('bn-BD', { day: 'numeric', month: 'short' });

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function today() { return iso(new Date()); }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
  function r2(x) { return Math.round(x * 100) / 100; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function norm(s) { return String(s || '').trim().toLowerCase(); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toNum(s) {
    var t = String(s == null ? '' : s).replace(/[০-৯]/g, function (d) { return DIG.indexOf(d); }).replace(/[,\s৳﷼$₹]/g, '');
    return t === '' ? NaN : parseFloat(t);
  }
  function num0(s) { var x = toNum(s); return isNaN(x) ? 0 : x; }

  var S = { settings: Object.assign({}, DEF), products: [], customers: [], orders: [], expenses: [] };
  var view = { tab: 'home', day: today(), month: today().slice(0, 7), of: 'all', q: '', openCust: null };
  var confirmFn = null;

  function money(n) { return S.settings.cur + ' ' + nf.format(n); }
  function signed(n) { return n < 0 ? '−' + money(-n) : money(n); }

  /* ---------- storage ---------- */
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { adopt(JSON.parse(raw)); return; }
    } catch (e) {}
    seed();
  }
  function adopt(o) {
    if (!o || !Array.isArray(o.orders) || !Array.isArray(o.products) || !Array.isArray(o.customers) || !Array.isArray(o.expenses)) throw new Error('bad');
    S.settings = Object.assign({}, DEF, o.settings || {});
    S.products = o.products; S.customers = o.customers; S.expenses = o.expenses;
    S.orders = o.orders.map(function (x) { x.items = x.items || []; x.payments = x.payments || []; x.delCharge = x.delCharge || 0; x.delCost = x.delCost || 0; x.discount = x.discount || 0; x.t = x.t || 0; return x; });
  }
  function seed() {
    var t = today();
    function d(n) { return addDays(t, -n); }
    var P = [['গিফট বক্স – ছোট', 25, 45], ['গিফট বক্স – বড়', 60, 110], ['কার্ড ও রিবন সেট', 5, 12]];
    S.products = P.map(function (p, i) { return { id: 'exp' + i, name: p[0], cost: p[1], price: p[2], ex: true }; });
    S.customers = [
      { id: 'exc0', name: 'রহিম উদ্দিন', phone: '0500000001', address: 'রিয়াদ, আল-নাজদ', ex: true },
      { id: 'exc1', name: 'সুমি আক্তার', phone: '0500000002', address: 'রিয়াদ, আল-মালাজ', ex: true },
      { id: 'exc2', name: 'করিম মিয়া', phone: '0500000003', address: 'জেদ্দা', ex: true }
    ];
    function mk(i, ci, date, lines, dc, dk, disc, payFull, payAmt, delivered) {
      var c = S.customers[ci];
      var o = {
        id: 'exo' + i, date: date, customerId: c.id, customerName: c.name, customerPhone: c.phone, address: c.address, note: '',
        items: lines.map(function (l) { var p = S.products[l[0]]; return { name: p.name, qty: l[1], price: p.price, cost: p.cost }; }),
        delCharge: dc, delCost: dk, discount: disc, payments: [], delivered: delivered, deliveredDate: delivered ? date : null, t: i, ex: true
      };
      var tot = oCalc(o).total;
      var amt = payFull ? tot : payAmt;
      if (amt > 0) o.payments.push({ date: date, amount: amt });
      return o;
    }
    S.orders = [
      mk(0, 0, d(0), [[0, 2], [2, 2]], 10, 8, 0, true, 0, true),
      mk(1, 1, d(1), [[1, 1], [2, 1]], 15, 12, 0, false, 50, false),
      mk(2, 0, d(3), [[1, 3]], 0, 0, 20, false, 100, true),
      mk(3, 2, d(5), [[0, 4], [2, 4]], 10, 8, 0, true, 0, true),
      mk(4, 1, d(8), [[1, 2]], 15, 12, 0, false, 100, true)
    ];
    S.expenses = [
      { id: 'exe0', date: d(0), amount: 35, cat: 'প্যাকেজিং', note: 'রিবন ও প্যাকেট', ex: true },
      { id: 'exe1', date: d(1), amount: 40, cat: 'বিজ্ঞাপন', note: 'ফেসবুক বুস্ট', ex: true },
      { id: 'exe2', date: d(3), amount: 18, cat: 'যাতায়াত', note: '', ex: true },
      { id: 'exe3', date: d(5), amount: 25, cat: 'বিল', note: 'ইন্টারনেট', ex: true }
    ];
  }

  /* ---------- calculations ---------- */
  function oCalc(o) {
    var sub = 0, cost = 0, paid = 0;
    o.items.forEach(function (i) { sub += i.qty * i.price; cost += i.qty * i.cost; });
    o.payments.forEach(function (p) { paid += p.amount; });
    var total = r2(sub + o.delCharge - o.discount);
    return { sub: sub, total: total, paid: r2(paid), due: Math.max(0, r2(total - paid)), profit: r2(sub - cost + o.delCharge - o.delCost - o.discount) };
  }
  function stats(match) {
    var s = { sales: 0, profit: 0, exp: 0, cash: 0, cnt: 0 };
    S.orders.forEach(function (o) {
      var c = oCalc(o);
      if (match(o.date)) { s.sales += c.total; s.profit += c.profit; s.cnt++; }
      o.payments.forEach(function (p) { if (match(p.date)) s.cash += p.amount; });
    });
    S.expenses.forEach(function (e) { if (match(e.date)) s.exp += e.amount; });
    s.net = r2(s.profit - s.exp);
    return s;
  }
  function custList() {
    var map = {}, arr = [];
    S.customers.forEach(function (c) {
      var x = { id: c.id, name: c.name, phone: c.phone || '', address: c.address || '', orders: [], ex: c.ex };
      map[c.id] = x; arr.push(x);
    });
    S.orders.forEach(function (o) {
      var x = map[o.customerId];
      if (!x) { x = { id: o.customerId, name: o.customerName || 'অজানা', phone: o.customerPhone || '', address: o.address || '', orders: [], orphan: true }; map[o.customerId] = x; arr.push(x); }
      x.orders.push(o);
    });
    arr.forEach(function (x) {
      x.due = 0; x.bought = 0; x.oldest = null;

  function intl(p) {

    if (!d) return '';
    if (d.indexOf('00') === 0) d = d.slice(2);
    else if (d.charAt(0) === '0') d = cc + d.slice(1);
    else if (cc && d.indexOf(cc) !== 0 && d.length <= 10) d = cc + d;
    return d;
  }

  function readItems() {
    var items = [], bad = false;
    Array.prototype.forEach.call(document.querySelectorAll('#orows .irow'), function (r) {
      var name = r.querySelector('.in-name').value.trim();
      var qty = toNum(r.querySelector('.in-qty').value), price = toNum(r.querySelector('.in-price').value), cost = num0(r.querySelector('.in-cost').value);
      var any = name || r.querySelector('.in-price').value.trim() || r.querySelector('.in-cost').value.trim();
      if (!any) return;
      if (!name || !(qty > 0) || isNaN(price) || price < 0) { bad = true; return; }
      items.push({ name: name, qty: qty, price: price, cost: cost });
    });
    return { items: items, bad: bad };
  }
  function updateSummary() {
    if (!$('oform')) return;
    var it = readItems().items, sub = 0, cost = 0;
    it.forEach(function (i) { sub += i.qty * i.price; cost += i.qty * i.cost; });
    var dc = num0($('odc').value), dk = num0($('odk').value), di = num0($('odi').value);
    var total = r2(sub + dc - di), profit = r2(sub - cost + dc - dk - di);
    var id = $('oform').getAttribute('data-id'), paid = 0;
    if (id) { var o = S.orders.filter(function (x) { return x.id === id; })[0]; if (o) o.payments.forEach(function (p) { paid += p.amount; }); }
    else if ($('oadv')) paid = num0($('oadv').value);
    $('sTotal').textContent = money(total);
    $('sProfit').textContent = signed(profit);
    $('sProfit').className = profit < 0 ? 'neg' : 'pos';
    $('sDue').textContent = money(Math.max(0, r2(total - paid)));
  }
  function saveOrder(form) {
    var id = form.getAttribute('data-id'), r = readItems();

    var date = $('od').value || today(), sel = $('oc').value, cust;

      cust = { id: uid(), name: nm, phone: $('cp').value.trim(), address: $('oa').value.trim() };
    } else {
      cust = S.customers.filter(function (c) { return c.id === sel; })[0] || { id: sel, name: '', phone: '' };
    }
    var dc = num0($('odc').value), dk = num0($('odk').value), di = num0($('odi').value);
    var o = id ? S.orders.filter(function (x) { return x.id === id; })[0] : null;
    var draft = { items: r.items, delCharge: dc, delCost: dk, discount: di, payments: o ? o.payments : [] };
    var total = oCalc(draft).total;
    if (total < 0) return fail('ছাড় মোট দামের চেয়ে বেশি হতে পারে না।');

      S.orders.push(fields);
    }
    save(); closeDlg(); render();
    return true;
  }

    if (kind === 'order') { saveOrder(f); return; }
    if (kind === 'pay') {
      var o = S.orders.filter(function (x) { return x.id === id; })[0], due = oCalc(o).due, a = toNum($('pa').value);
      if (!(a > 0)) return void fail('টাকার পরিমাণ লিখুন।');

      if (amt > c.due + 0.001) return void fail('মোট বাকির (' + money(c.due) + ') চেয়ে বেশি লেখা যাবে না।');
      var date = $('pd').value || today(), rem = r2(amt);
      S.orders.filter(function (x) { return x.customerId === id && oCalc(x).due > 0; })
        .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.t - b.t; })
        .forEach(function (x) { var p = Math.min(oCalc(x).due, rem); if (p > 0) { x.payments.push({ date: date, amount: r2(p) }); rem = r2(rem - p); } });
    } else if (kind === 'customer') {
      var nm = $('cn').value.trim();
      if (!nm) return void fail('কাস্টমারের নাম লিখুন।');
      var cu = id ? S.customers.filter(function (x) { return x.id === id; })[0] : null;
      if (cu) { cu.name = nm; cu.phone = $('cp').value.trim(); cu.address = $('ca').value.trim(); delete cu.ex; }
      else S.customers.push({ id: uid(), name: nm, phone: $('cp').value.trim(), address: $('ca').value.trim() });
      if (cu) S.orders.forEach(function (x) { if (x.customerId === cu.id) { x.customerName = cu.name; x.customerPhone = cu.phone; } });
    } else if (kind === 'product') {
      var pn = $('pn').value.trim(), pc = toNum($('pc').value), pp = toNum($('pp').value);
      if (!pn) return void fail('পণ্যের নাম লিখুন।');
      if (isNaN(pp) || pp < 0) return void fail('বিক্রির দাম লিখুন।');
      var pr = id ? S.products.filter(function (x) { return x.id === id; })[0] : null;
      if (pr) { pr.name = pn; pr.cost = isNaN(pc) ? 0 : pc; pr.price = pp; delete pr.ex; }
      else S.products.push({ id: uid(), name: pn, cost: isNaN(pc) ? 0 : pc, price: pp });
    } else if (kind === 'expense') {
      var xa = toNum($('xa').value);
      if (!(xa > 0)) return void fail('টাকার পরিমাণ লিখুন।');
      var xd = $('xd').value || today();
      S.expenses.push({ id: uid(), date: xd, amount: r2(xa), cat: $('xc').value, note: $('xn').value.trim() });
      view.month = xd.slice(0, 7);
    }
    save(); closeDlg(); render();
  });

  /* ---------- input events ---------- */
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'oq') { view.q = t.value; $('olist').innerHTML = orderList(); return; }
    if (t.id === 'mt') { refreshMsg(); return; }
    if (t.id === 'pc' || t.id === 'pp') { prodPreview(); return; }
    if (t.id === 'oa') { t.setAttribute('data-auto', ''); }
    if (t.classList && t.classList.contains('in-name')) {
      var p = S.products.filter(function (x) { return norm(x.name) === norm(t.value); })[0], row = t.closest('.irow');
      if (p && row.getAttribute('data-m') !== p.id) {
        row.setAttribute('data-m', p.id);
        row.querySelector('.in-price').value = p.price; row.querySelector('.in-cost').value = p.cost;
      } else if (!p) row.removeAttribute('data-m');
    }
    if (t.closest && t.closest('#oform')) updateSummary();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'oc') {
      var isNew = t.value === '__new';
      $('newc').hidden = !isNew;
      var oa = $('oa');
      if (!isNew && oa.getAttribute('data-auto') === '1') { var c = findCust(t.value); oa.value = c ? c.address : ''; }
    } else if (t.id === 'sShop') { S.settings.shop = t.value.trim() || DEF.shop; save(); $('shopName').textContent = S.settings.shop; }
    else if (t.id === 'sCur') { S.settings.cur = t.value; save(); }
    else if (t.id === 'sCc') { S.settings.cc = t.value.replace(/\D/g, ''); t.value = S.settings.cc; save(); }
    else if (t.id === 'sTd') { S.settings.tplDue = t.value; save(); }
    else if (t.id === 'sTo') { S.settings.tplOrder = t.value; save(); }
    else if (t.id === 'rf' && t.files && t.files[0]) restoreFrom(t.files[0]);
    if (t.closest && t.closest('#oform')) updateSummary();
  });

  /* ---------- export / restore ---------- */
  function download(name, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
  }
  function bmsg(t) { var m = $('bmsg'); if (m) m.textContent = t; }
  function exportCsv() {
    function q(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
    var rows = [['তারিখ', 'কাস্টমার', 'ফোন', 'পণ্য', 'মোট', 'পেয়েছি', 'বাকি', 'লাভ', 'ডেলিভারি']];
    S.orders.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (o) {
      var c = oCalc(o);
      rows.push([o.date, o.customerName, o.customerPhone, itemsText(o), c.total, c.paid, c.due, c.profit, o.delivered ? 'হয়েছে' : 'বাকি']);
    });
    download('orders-' + today() + '.csv', '﻿' + rows.map(function (r) { return r.map(q).join(','); }).join('\r\n'), 'text/csv;charset=utf-8');
    bmsg('অর্ডারের তালিকা নামানো হয়েছে।');
  }
  function restoreFrom(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result);
        ask('ব্যাকআপ ফিরিয়ে আনলে এখনকার সব হিসাব বদলে যাবে। এগোবেন?', 'হ্যাঁ, ফিরিয়ে আনুন', function () { adopt(o); save(); render(); });
      } catch (err) { bmsg('ফাইলটি পড়া যায়নি। এই অ্যাপের ব্যাকআপ ফাইল বেছে নিন।'); }
    };
    fr.readAsText(file);
  }

  /* ---------- clicks ---------- */
  function find(coll, id) { return S[coll].filter(function (x) { return x.id === id; })[0]; }
  var ACT = {
    closeDlg: closeDlg,
    confirmYes: function () { var f = confirmFn; confirmFn = null; closeDlg(); if (f) f(); },
    dayPrev: function () { view.day = addDays(view.day, -1); render(); },
    dayNext: function () { view.day = addDays(view.day, 1); render(); },
    monthPrev: function () { var d = parseISO(view.month + '-01'); d.setMonth(d.getMonth() - 1); view.month = iso(d).slice(0, 7); render(); },
    monthNext: function () { var d = parseISO(view.month + '-01'); d.setMonth(d.getMonth() + 1); view.month = iso(d).slice(0, 7); render(); },
    newOrder: function () { openOrderForm(); },
    editOrder: function (id) { openOrderForm(id); },
    addRow: function () { $('orows').insertAdjacentHTML('beforeend', rowHtml()); },
    delRow: function (id, t) {
      var rows = document.querySelectorAll('#orows .irow');
      if (rows.length > 1) t.closest('.irow').remove(); else { t.closest('.irow').outerHTML = rowHtml(); }
      updateSummary();
    },
    delOrder: function (id) { ask('এই অর্ডারটি মুছে ফেলবেন?', null, function () { S.orders = S.orders.filter(function (o) { return o.id !== id; }); save(); render(); }); },
    deliver: function (id) { var o = find('orders', id); o.delivered = !o.delivered; o.deliveredDate = o.delivered ? today() : null; save(); render(); },
    payOrder: function (id) { openPay(id); },
    msgOrder: function (id) {
      var o = find('orders', id), c = oCalc(o);
      openMsg(o.customerName, o.customerPhone, fillTpl(S.settings.tplOrder, { 'নাম': o.customerName, 'দোকান': S.settings.shop, 'অর্ডার': itemsText(o), 'মোট': money(c.total), 'বাকি': money(c.due) }));
    },
    msgCust: function (id) {
      var c = findCust(id);
      openMsg(c.name, c.phone, fillTpl(S.settings.tplDue, { 'নাম': c.name, 'দোকান': S.settings.shop, 'বাকি': money(c.due), 'অর্ডার': '', 'মোট': money(c.bought) }));
    },
    payCust: function (id) { openCustPay(id); },
    toggleCust: function (id) { view.openCust = view.openCust === id ? null : id; render(); },
    newCustomer: function () { openCustomer(); },
    editCust: function (id) { openCustomer(id); },
    delCust: function (id) { ask('এই কাস্টমারকে মুছে ফেলবেন?', null, function () { S.customers = S.customers.filter(function (c) { return c.id !== id; }); save(); render(); }); },
    newProduct: function () { openProduct(); },
    editProduct: function (id) { openProduct(id); },
    delProduct: function (id) { ask('এই পণ্যটি মুছে ফেলবেন? আগের অর্ডারের হিসাব বদলাবে না।', null, function () { S.products = S.products.filter(function (p) { return p.id !== id; }); save(); render(); }); },
    newExpense: function () { openExpense(); },
    delExpense: function (id) { ask('এই খরচটি মুছে ফেলবেন?', null, function () { S.expenses = S.expenses.filter(function (x) { return x.id !== id; }); save(); render(); }); },
    clearEx: function () {
      ask('সব উদাহরণ হিসাব মুছে ফেলবেন? আপনার নিজের লেখা হিসাব থাকবে।', 'হ্যাঁ, উদাহরণ মুছুন', function () {
        ['products', 'customers', 'orders', 'expenses'].forEach(function (k) { S[k] = S[k].filter(function (x) { return !x.ex; }); });
        save(); render();
      });
    },
    exportJson: function () { download('khata-backup-' + today() + '.json', JSON.stringify(S), 'application/json'); bmsg('ব্যাকআপ ফাইল নামানো হয়েছে। ফাইলটি নিরাপদ জায়গায় রাখুন।'); },
    exportCsv: exportCsv,
    pickRestore: function () { $('rf').click(); },
    copyMsg: function () {
      var t = $('mt'), m = $('mmsg');
      function sel() { t.focus(); t.select(); m.textContent = 'লেখাটি বেছে নেওয়া হয়েছে, কপি করুন।'; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(function () { m.textContent = 'কপি হয়েছে।'; }, sel); else sel();
    }
  };
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-tab],[data-f]');
    if (!t) return;
    if (t.hasAttribute('data-tab')) { setTab(t.getAttribute('data-tab')); return; }
    if (t.hasAttribute('data-f')) { view.of = t.getAttribute('data-f'); render(); return; }
    var fn = ACT[t.getAttribute('data-act')];
    if (fn) fn(t.getAttribute('data-id'), t);
  });

  load();
  render();
})();
</script>
</body>
</html>
